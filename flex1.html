<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            background-color: blue;
            /*flex-direction: row;*/
            flex-direction: column;
        }
        .container div{
            background-color: rgb(212, 212, 228);
            width: 100px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>flex-direction: row</h1>
    <p>flex-direction: row; displays the flex items horizontally (from left to right):</p>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        </div>
</body>
</html>
